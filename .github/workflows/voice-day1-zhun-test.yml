# One-off test: does Xiaoxiao pronounce 准 correctly in context?
# Day 1 chunk_05 ("准。" alone, 0.29s speech) was heard as 纯 by Whisper
# base (prob 0.44, forced-zh too). Isolated single syllables are the
# weakest case for the judge, so test the same word inside its carrier
# sentence before deciding whether to merge chunks 04+05.
name: Voice Day 1 zhun test

on:
  workflow_dispatch:

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install edge-tts and ffmpeg
        run: pip install edge-tts && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate test clips
        run: |
          mkdir -p voice-zhun-test
          python3 - <<'PY'
          import asyncio, edge_tts
          clips = {
            "carrier.mp3": "发过去三分钟，老板回了一个字：准。",
            "alone2.mp3": "准。",
          }
          async def main():
              for out, text in clips.items():
                  await edge_tts.Communicate(text, "zh-CN-XiaoxiaoNeural", rate="+10%").save(f"voice-zhun-test/{out}")
                  print("wrote", out, flush=True)
          asyncio.run(main())
          PY
          for f in voice-zhun-test/*.mp3; do echo -n "$f "; ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"; done
      - name: Upload test clips
        uses: actions/upload-artifact@v4
        with:
          name: voice-day1-zhun-test
          path: voice-zhun-test/
          retention-days: 3
