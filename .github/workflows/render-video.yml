# Render video — Muse打工日记 Day 0 10s test
# Source: Remotion official GitHub Actions example
# (https://www.remotion.dev/docs/ssr/ — checkout → setup-node →
#  npm i → npx remotion render → upload-artifact),
# adapted to this project:
#   - composition is DayVideo (not the example's MyComp)
#   - props are generated by build-day.mjs from day-0.yaml (10s only),
#     NOT hand-written in the workflow
#   - render uses the exact flags build-day.mjs uses locally, except
#     --concurrency (local host is 1.5 CPU so it uses 1; the public
#     ubuntu-latest runner has 4 vCPU, so 2 = half the cores)
#   - only the 10s sample is rendered here; the 40s full version is
#     a separate step after this test passes
name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    name: Render Day 0 10s sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # node_modules is ~1.1GB (Remotion + React + Chrome Headless
      # Shell cache inside node_modules/.remotion). Cache it by
      # package-lock.json so a repeat run skips the full install.
      # Cache limit is 10GB/repo; this one entry is ~1.1GB.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: remotion/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: remotion
        run: npm install

      # Generate day-0-props.json + public/voice.mp3 from day-0.yaml.
      # Do NOT commit day-0-props.json: the copy in the local project
      # is currently the 40s full-version props (13 segments) and would
      # silently render the wrong duration. build-day.mjs also copies
      # sample/sample-10s-voice-aria-11x.mp3 to public/voice.mp3.
      # The --render flag is deliberately NOT used here: it hard-codes
      # --concurrency=1 for the 1.5-CPU local host.
      - name: Generate props from day-0.yaml
        working-directory: remotion
        run: node build-day.mjs day-0.yaml

      # ubuntu-latest images ship ffmpeg, but fail fast with a clear
      # message instead of a cryptic Remotion error if it ever goes away.
      - name: Check ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      # 9.281875s * 60fps = 557 frames. --duration overrides the
      # hard-coded 557 in Root.tsx (same value here, but explicit so a
      # future YAML change cannot be silently truncated — this bug bit
      # the local full render once: the old --duration-in-frames flag
      # does not exist in Remotion 4 and was silently ignored).
      - name: Render DayVideo (10s sample)
        working-directory: remotion
        run: >
          npx remotion render src/index.ts DayVideo
          out/day0-10s-actions.mp4
          --props=day-0-props.json
          --duration=557
          --codec=h264
          --concurrency=2
          --log=verbose

      # retention-days: 3 — artifact free storage is 500MB; a ~1MB
      # 10s sample (40s full is ~3.6MB) must not accumulate. Download
      # it right after the run, then delete it from the Artifacts page.
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: day0-10s-actions
          path: |
            remotion/out/day0-10s-actions.mp4
            remotion/day-0-props.json
          retention-days: 3
