# Render video — Muse打工日记 Day 0 (10s sample / 40s full)
# Source: Remotion official GitHub Actions example
# (https://www.remotion.dev/docs/ssr/ — checkout → setup-node →
#  npm i → npx remotion render → upload-artifact),
# adapted to this project:
#   - composition is DayVideo (not the example's MyComp)
#   - props are generated by build-day.mjs from the YAML, NOT
#     hand-written in the workflow
#   - render uses the exact flags build-day.mjs uses locally, except
#     --concurrency (local host is 1.5 CPU so it uses 1; the public
#     ubuntu-latest runner has 4 vCPU, so each shard job uses 4)
#   - workflow_dispatch input `version` selects 10s (day-0.yaml, 557
#     frames) or 40s (day-0-full.yaml, 2411 frames); the 10s path is
#     unchanged by this addition
#   - 40s voice is 40.19s SILENCE (sample/silence-40s.mp3): the real
#     40s Aria mp3 is NOT committed to the public repo, and
#     workflow_dispatch has no file-upload input type, so a silent
#     placeholder is the only clean way to verify the render chain,
#     subtitles and timing. Audio audibility is NOT verified by the
#     40s run (see REPORT §9).
#   - SHARDED RENDER (2026-11-15, speed round 2): the 2411 frames are
#     split into 4 matrix jobs (~603 frames each, --frames=start-end),
#     then one assemble job concatenates the 4 mp4s with ffmpeg
#     (concat demuxer, -c copy). Locally verified 2026-11-15: each
#     shard renders exactly its frame range with audio trimmed to the
#     range, concat gives the exact total frame count (120 frames for
#     a 2-shard test), no duplicate/gap frame at the boundary
#     (shard0-last vs shard1-first ≈ 1 frame of motion, 0.30 vs
#     0.18 adjacent-frame baseline). If sharding ever regresses,
#     revert to the single-job render with --concurrency=4 (commit
#     6118dfe).
#   - APT CACHE (2026-11-15): /var/cache/apt/archives + /var/lib/apt/lists
#     are cached (key Linux-apt-ffmpeg-fonts-v1) so the ffmpeg +
#     fonts-noto-cjk install (~19-24s uncached) skips the download on
#     a hit; apt-get update is skipped on a cache hit. The cache dirs
#     are chown'ed to the runner user first, otherwise actions/cache
#     cannot restore into root-owned paths.
name: Render video

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Which version to render"
        type: choice
        required: true
        default: "10s"
        options:
          - "10s"
          - "40s"

jobs:
  render:
    name: Render shard ${{ matrix.shard }} (${{ inputs.version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 10s: day-0.yaml, 557 frames, out/day0-10s-actions.mp4.
      # 40s: day-0-full.yaml, 2411 frames (40.19s x 60fps),
      # out/day0-full-actions.mp4. Everything else is identical.
      - name: Select version
        run: |
          if [ "${{ inputs.version }}" = "40s" ]; then
            echo "YAML_FILE=day-0-full.yaml" >> "$GITHUB_ENV"
            echo "DURATION=2411" >> "$GITHUB_ENV"
            echo "OUT_NAME=day0-full-actions.mp4" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=day0-full-actions" >> "$GITHUB_ENV"
          else
            echo "YAML_FILE=day-0.yaml" >> "$GITHUB_ENV"
            echo "DURATION=557" >> "$GITHUB_ENV"
            echo "OUT_NAME=day0-10s-actions.mp4" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=day0-10s-actions" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV" | grep -E "YAML_FILE|DURATION|OUT_NAME|ARTIFACT_NAME"

      # node_modules is ~1.1GB (Remotion + React + Chrome Headless
      # Shell cache inside node_modules/.remotion). Cache it by
      # package-lock.json so a repeat run skips the full install.
      # Cache limit is 10GB/repo; this one entry is ~1.1GB.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: remotion/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: remotion
        run: npm install

      # Generate day-0-props.json + public/voice.mp3 from the YAML.
      # Do NOT commit day-0-props.json: the copy in the local project
      # is currently the 40s full-version props (13 segments) and would
      # silently render the wrong duration. build-day.mjs also copies
      # the voice mp3 to public/voice.mp3.
      # The --render flag is deliberately NOT used here: it hard-codes
      # --concurrency=1 for the 1.5-CPU local host.
      - name: Generate props from YAML
        working-directory: remotion
        run: node build-day.mjs $YAML_FILE

      # ubuntu-latest (now Ubuntu 26.04) ships NEITHER ffmpeg NOR any
      # CJK font: run 1 (2026-11-15) installed ffmpeg here (22s) but
      # every Chinese character still rendered as tofu boxes, because
      # DayVideo.tsx asks for 'Noto Sans CJK SC' / 'Noto Sans CJK' /
      # 'PingFang SC' and the runner has none of them. The ball itself
      # was pixel-identical to local v2 (mean channel diff 0.41/255),
      # so this step is the only fix needed: install fonts-noto-cjk
      # alongside ffmpeg, in the same apt-get update.
      - name: Prepare apt cache dirs
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial /var/lib/apt/lists/partial
          sudo chown -R "$USER:$USER" /var/cache/apt/archives /var/lib/apt/lists

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-ffmpeg-fonts-v1

      - name: Check ffmpeg and install CJK fonts
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          fi
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version | head -1
          fc-list | grep -ci "Noto Sans CJK"

      # Shard range: ceil(DURATION/4) frames per shard, last shard
      # clamped to DURATION-1. 40s: 0-602 / 603-1205 / 1206-1808 /
      # 1809-2410. 10s: 0-139 / 140-279 / 280-419 / 420-556.
      # --frames renders exactly that range (inclusive, 0-indexed)
      # with audio trimmed to the range — verified locally 2026-11-15.
      - name: Compute shard range
        run: |
          PER=$(( (DURATION + 3) / 4 ))
          START=$(( ${{ matrix.shard }} * PER ))
          END=$(( START + PER - 1 ))
          if [ "$END" -ge "$DURATION" ]; then END=$(( DURATION - 1 )); fi
          echo "SHARD_START=$START" >> "$GITHUB_ENV"
          echo "SHARD_END=$END" >> "$GITHUB_ENV"
          echo "Shard ${{ matrix.shard }}: frames $START-$END ($(( END - START + 1 )) frames)"

      # --duration overrides the hard-coded 557 in Root.tsx (explicit
      # so a YAML change cannot be silently truncated — this bug bit
      # the local full render once: the old --duration-in-frames flag
      # does not exist in Remotion 4 and was silently ignored).
      - name: Render DayVideo shard
        working-directory: remotion
        run: >
          npx remotion render src/index.ts DayVideo
          out/shard-${{ matrix.shard }}.mp4
          --props=day-0-props.json
          --duration=$DURATION
          --frames=$SHARD_START-$SHARD_END
          --codec=h264
          --concurrency=4
          --log=verbose

      # retention-days: 3 — artifact free storage is 500MB. The props
      # JSON is uploaded with every shard (identical content) so the
      # assemble job can put it in the final artifact, as before.
      - name: Upload shard video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-shard-${{ matrix.shard }}
          path: |
            remotion/out/shard-${{ matrix.shard }}.mp4
            remotion/day-0-props.json
          retention-days: 3

  assemble:
    name: Assemble ${{ inputs.version }}
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Select version
        run: |
          if [ "${{ inputs.version }}" = "40s" ]; then
            echo "OUT_NAME=day0-full-actions.mp4" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=day0-full-actions" >> "$GITHUB_ENV"
          else
            echo "OUT_NAME=day0-10s-actions.mp4" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=day0-10s-actions" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV" | grep -E "OUT_NAME|ARTIFACT_NAME"

      # Only ffmpeg is needed to concatenate; fonts are not needed
      # here (no rendering happens in this job). Same apt cache as
      # the render jobs, so a hit makes this a few seconds.
      - name: Prepare apt cache dirs
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial /var/lib/apt/lists/partial
          sudo chown -R "$USER:$USER" /var/cache/apt/archives /var/lib/apt/lists

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-ffmpeg-fonts-v1

      - name: Install ffmpeg
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          fi
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      # Shard artifacts are named <ARTIFACT_NAME>-shard-0..3, each
      # holding shard-N.mp4 (+ the identical props JSON).
      # merge-multiple puts all files in one dir; duplicate props
      # JSONs overwrite each other with identical content.
      - name: Download shard videos
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_NAME }}-shard-*
          path: shards
          merge-multiple: true

      # Concat demuxer with -c copy: no re-encode, no quality loss.
      # Each shard's audio is already trimmed to its frame range, so
      # the joined audio is the full 40.19s (plus the usual AAC
      # priming, same as a single-piece render).
      - name: Concatenate shards
        run: |
          ls -lh shards/
          for i in 0 1 2 3; do
            test -f "shards/shard-$i.mp4" || { echo "MISSING shards/shard-$i.mp4"; exit 1; }
            ffprobe -v error -show_entries format=duration -of csv=p=0 "shards/shard-$i.mp4"
            echo "file 'shards/shard-$i.mp4'" >> concat.txt
          done
          mkdir -p out
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy "out/$OUT_NAME"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 "out/$OUT_NAME"

      # retention-days: 3 — artifact free storage is 500MB; a ~1MB
      # 10s sample (40s full is ~4.4MB) must not accumulate. Download
      # it right after the run, then delete it from the Artifacts page.
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/${{ env.OUT_NAME }}
            shards/day-0-props.json
          retention-days: 3
