# Day 0 — full episode, Remotion v5-corrected main line.
# v5-corrected beats (2026-11-15 browser measurement): NO dance, NO
# spin, NO shake — the ball rolls along the road, bounces, and lands
# 1.6x wide once at the end (land, segment 12 offset 1.6 -> landing
